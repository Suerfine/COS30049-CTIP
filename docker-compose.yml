services:
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    command: npm run web -- --host lan --port 8081
    env_file: 
      - ./frontend/.env
    environment:
      EXPO_PUBLIC_USE_RELATIVE_API: "true"
      EXPO_PUBLIC_API_PROTOCOL: "http"
      EXPO_PUBLIC_API_HOST: "localhost"
      EXPO_PUBLIC_API_PORT: "80"
      EXPO_PUBLIC_API_HTTP_PORT: "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8081', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      HTTPS_ENABLED: "false"
      FORCE_HTTPS_REDIRECT: "false"
    volumes:
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ai-service:
  #   build:
  #     context: ./ai
  #   container_name: ai-service
  #   restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      # - ai-service